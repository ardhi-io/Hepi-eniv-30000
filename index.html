<style>
:root{
  --bg:#1C0F13;
  --bg-deep:#140A0D;
  --card:#2A1519;
  --ink:#F1E4E1;
  --ink-soft:#C9A9AC;
  --wine:#6E2233;
  --wine-soft:#4A1C28;
  --rose:#B85C6E;
  --gold:#C8A465;
  --line:rgba(241,228,225,0.1);
}

*{
  box-sizing:border-box;
}

html,body{
  height:100%;
  width:100%;
}

body{
  margin:0;
  background:var(--bg-deep);
  color:var(--ink);
  font-family:'Quicksand',sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

.hand{
  font-family:'Caveat',cursive;
}

button{
  font-family:inherit;
  cursor:pointer;
  border:none;
  background:none;
}

button:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:3px;
}

#app{
  position:relative;
  height:100vh;
  height:100dvh;
  width:100%;
  max-width:480px;
  margin:0 auto;

  display:flex;
  flex-direction:column;

  background:
    radial-gradient(
      ellipse at 20% 0%,
      rgba(110,34,51,0.35),
      transparent 55%
    ),
    radial-gradient(
      ellipse at 90% 100%,
      rgba(200,164,101,0.10),
      transparent 50%
    ),
    var(--bg);

  overflow:hidden;
}

.dots{
  position:relative;
  z-index:5;
  display:flex;
  gap:5px;
  justify-content:center;
  padding:14px 12px 8px;
  flex-shrink:0;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--line);
  transition:background .3s,transform .3s;
}

.dot.active{
  background:var(--gold);
  transform:scale(1.4);
}

#slides{
  position:relative;
  flex:1;
  min-height:0;
  perspective:1400px;
  overflow:hidden;
}

.slide{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;

  min-height:0;

  padding:6px 18px 18px;

  opacity:0;
  pointer-events:none;

  transform-style:preserve-3d;
  backface-visibility:hidden;

  z-index:1;
}

.slide.current{
  opacity:1;
  pointer-events:auto;
  z-index:2;
}

.slide.leaving-fwd{
  z-index:3;
  transform-origin:left center;
  animation:page-turn-fwd .6s cubic-bezier(.4,.1,.3,1) forwards;
}

.slide.leaving-back{
  z-index:3;
  transform-origin:right center;
  animation:page-turn-back .6s cubic-bezier(.4,.1,.3,1) forwards;
}

@keyframes page-turn-fwd{
  0%{
    transform:rotateY(0);
    opacity:1;
  }

  60%{
    opacity:.75;
    box-shadow:-30px 0 40px rgba(0,0,0,.35);
  }

  100%{
    transform:rotateY(-115deg);
    opacity:0;
  }
}

@keyframes page-turn-back{
  0%{
    transform:rotateY(0);
    opacity:1;
  }

  60%{
    opacity:.75;
    box-shadow:30px 0 40px rgba(0,0,0,.35);
  }

  100%{
    transform:rotateY(115deg);
    opacity:0;
  }
}

.photo-frame{
  width:100%;
  aspect-ratio:4/3;

  border-radius:18px;
  overflow:hidden;

  background:linear-gradient(
    135deg,
    var(--wine-soft),
    var(--card)
  );

  flex-shrink:0;
  position:relative;

  border:1px solid rgba(200,164,101,.25);

  animation:glow-breathe 3.6s ease-in-out infinite;
}

@keyframes glow-breathe{
  0%,100%{
    box-shadow:
      0 12px 26px rgba(0,0,0,.45),
      0 0 0 rgba(200,164,101,0);
  }

  50%{
    box-shadow:
      0 12px 26px rgba(0,0,0,.45),
      0 0 22px rgba(200,164,101,.35);
  }
}

.photo-frame img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.no-photo img{
  display:none;
}

.no-photo::after{
  content:"taruh fotonya di sini 🩷";

  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;
  padding:0 30px;

  font-family:'Caveat',cursive;
  font-size:1.3rem;
  color:var(--ink-soft);
}

.twinkle{
  position:absolute;
  color:#FFE9BE;
  font-size:.7rem;

  mix-blend-mode:screen;
  opacity:0;

  pointer-events:none;

  animation:twinkle 2.6s ease-in-out infinite;
}

@keyframes twinkle{
  0%,100%{
    opacity:0;
    transform:scale(.5) rotate(0);
  }

  50%{
    opacity:1;
    transform:scale(1.15) rotate(20deg);
  }
}

.cover{
  flex:1;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  gap:16px;

  overflow:auto;
  padding:4px 0;

.cover .kicker{

  font-size:1.15rem;
  color:var(--gold);

.cover h1{

  margin:0;

  line-height:1.1;

  color:var(--ink);
}

.cover p{

  line-height:1.65;

  max-width:340px;

  margin:0;

  color:var(--ink-soft);
}

.cover .photo-frame{
  aspect-ratio:1/1;
  width:74%;
  margin-bottom:2px;

.chat-panel,
.letter-panel{
  flex:1;

  margin-top:14px;

  min-height:0;

  display:flex;
  flex-direction:column;

  background:var(--card);

  border-radius:18px;

  box-shadow:0 10px 24px rgba(0,0,0,.4);

  overflow:hidden;

  border:1px solid var(--line);

  position:relative;
}

.chat-panel.shimmer::before,
.letter-panel.shimmer::before{

  position:absolute;

  top:0;
  bottom:0;

  width:60%;

  background:
    linear-gradient(
      100deg,
      transparent,
      rgba(200,164,101,.22),
      transparent

  transform:translateX(-140%);

  animation:shimmer-sweep 1.1s ease forwards;

  z-index:3;

  pointer-events:none;
}

@keyframes shimmer-sweep{
  to{
    transform:translateX(220%);
  }
}

.chat-scroll,
.letter-scroll{
  flex:1;

  overflow-y:auto;

  padding:16px 16px 6px;

  display:flex;
  flex-direction:column;

  gap:6px;

  -webkit-overflow-scrolling:touch;
}

.msg-row{
  display:flex;
  flex-direction:column;

  max-width:80%;

  opacity:0;

  transform:
    translateY(8px)
    scale(.96)
    rotate(-1deg);

  animation:
    pop-in .4s
    cubic-bezier(.2,.8,.3,1.2)
    forwards;
}

@keyframes pop-in{
  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1)
      rotate(0);
  }
}

.msg-row.from-a{
  align-self:flex-start;
}

.msg-row.from-k{
  align-self:flex-end;
}

.sender-label{
  font-size:.66rem;
  font-weight:600;

  color:var(--ink-soft);

  margin:6px 2px 2px;
}

.msg-row.from-k .sender-label{
  text-align:right;
}

.bubble{

  border-radius:16px;

  font-size:.92rem;
  line-height:1.4;

  word-break:break-word;
}

.from-a .bubble{
  background:var(--wine-soft);

.from-k .bubble{

.bubble.link a{

.letter-scroll{

.letter-kicker{

.letter-title{

.letter-p{

  font-style:italic;

  font-size:1.18rem;

  line-height:1.65;

  color:var(--ink);

  animation:pop-in-p .6s ease forwards;
}

@keyframes pop-in-p{
  to{

@keyframes heartbeat{
  0%,100%{

  }

  15%{
    transform:scale(1.08);
  }

  30%{

  }

  45%{

  align-items:center;
  justify-content:space-between;

.nav-btn{

.nav-btn:disabled{

.nav-btn.big{

@keyframes btn-glow{

@media(max-height:650px){

@media(prefers-reduced-motion:reduce){

  .msg-row,
  .letter-p{
    animation:none;
    opacity:1;
    transform:none;
  }

  .slide.leaving-fwd,
  .slide.leaving-back{
    animation:none;
    opacity:0;
  }

  .photo-frame,
  .twinkle,
  .nav-btn.big,
  .letter-sig .name{
    animation:none;
  }

  .chat-panel.shimmer::before,
  .letter-panel.shimmer::before{
    animation:none;
    display:none;
  }
}
</style>
</head>

/*
   GANTI FOTO:

   Pastikan file:
   slide1.jpg
   slide2.jpg
   ...

   berada di folder yang sama dengan index.html.

function imgTag(photo, alt){

  if(!photo){
    return null;
  }

  const img =
    document.createElement('img');

  img.src = photo;

  img.alt = alt || '';

  img.addEventListener(
    'error',
    function(){

      this.style.display = 'none';

      const frame =
        this.closest('.photo-frame');

      if(frame){
        frame.classList.add('no-photo');
      }

    }
  );

  return img;
}


function twinkleSpans(){

  return TWINKLE_POS.map(

    t =>

      '<span class="twinkle" ' +

      'style="' +

      'top:'+t.top+';' +

      'left:'+t.left+';' +

      'animation-delay:'+t.delay+';' +

      '">' +

      '✦' +

      '</span>'

  ).join('');

}


function buildSlide(s,i){

  const el =
    document.createElement('div');

  el.className = 'slide';

  el.dataset.index = i;


  /* ================= COVER ================= */

  if(s.type === 'cover'){

    const cover =
      document.createElement('div');

    cover.className = 'cover';


    const frame =
      document.createElement('div');

    frame.className = 'photo-frame';


    const image =
      imgTag(s.photo,s.title);

    if(image){
      frame.appendChild(image);
    }

    frame.insertAdjacentHTML(
      'beforeend',
      twinkleSpans()
    );


    const kicker =
      document.createElement('div');

    kicker.className =
      'kicker hand';

    kicker.textContent =
      s.kicker;


    const title =
      document.createElement('h1');

    title.textContent =
      s.title;


    const text =
      document.createElement('p');

    text.textContent =
      s.text;


    cover.appendChild(frame);

    cover.appendChild(kicker);

    cover.appendChild(title);

    cover.appendChild(text);


    el.appendChild(cover);

  }


  /* ================= CHAT ================= */

  else if(s.type === 'chat'){

    const frame =
      document.createElement('div');

    frame.className =
      'photo-frame';


    const image =
      imgTag(s.photo,'Momen chat');

    if(image){
      frame.appendChild(image);
    }

    frame.insertAdjacentHTML(
      'beforeend',
      twinkleSpans()
    );


    const panel =
      document.createElement('div');

    panel.className =
      'chat-panel';

    panel.id =
      'panel-' + i;


    const scroll =
      document.createElement('div');

    scroll.className =
      'chat-scroll';

    scroll.id =
      'scroll-' + i;


    panel.appendChild(scroll);


    el.appendChild(frame);

    el.appendChild(panel);

  }


  /* ================= LETTER ================= */

  else if(s.type === 'letter'){

    if(s.photo){

      const frame =
        document.createElement('div');

      frame.className =
        'photo-frame';

      frame.style.aspectRatio =
        '16/9';


      const image =
        imgTag(s.photo,s.title);

      if(image){
        frame.appendChild(image);
      }

      frame.insertAdjacentHTML(
        'beforeend',
        twinkleSpans()
      );


      el.appendChild(frame);

    }


    const panel =
      document.createElement('div');

    panel.className =
      'letter-panel';

    panel.id =
      'panel-' + i;


    panel.style.marginTop =
      s.photo ? '14px' : '6px';


    const scroll =
      document.createElement('div');

    scroll.className =
      'letter-scroll';

    scroll.id =
      'scroll-' + i;


    panel.appendChild(scroll);

    el.appendChild(panel);

  }


  return el;

}


/* ================= INIT ================= */

function init(){

  slidesEl.innerHTML = '';

  dotsEl.innerHTML = '';


  slides.forEach(

    (s,i) => {

      slidesEl.appendChild(
        buildSlide(s,i)
      );


      const dot =
        document.createElement('div');

      dot.className =
        'dot';


      dotsEl.appendChild(dot);

    }

  );


  showSlide(0,null);

}


/* ================= RENDER ================= */

function renderStep(i){

  const s =
    slides[i];


  const scroll =
    document.getElementById(
      'scroll-' + i
    );


  if(!scroll){
    return;
  }


  scroll.innerHTML = '';


  /* ================= CHAT ================= */

  if(s.type === 'chat'){

    let lastWho = null;


    for(

      let m = 0;

      m < revealedCount &&
      m < s.messages.length;

      m++

    ){

      const msg =
        s.messages[m];


      const row =
        document.createElement('div');

      row.className =
        'msg-row from-' +
        msg.who;


      if(msg.who !== lastWho){

        const label =
          document.createElement('div');

        label.className =
          'sender-label';


        label.textContent =
          msg.who === 'a'
            ? 'Ardhian'
            : 'Kailash';


        row.appendChild(label);


        lastWho =
          msg.who;

      }


      const bubble =
        document.createElement('div');

      bubble.className =
        'bubble' +
        (msg.link ? ' link' : '');


      if(msg.link){

        const a =
          document.createElement('a');


        a.href =
          'https://' + msg.text;


        a.target =
          '_blank';


        a.rel =
          'noopener';


        a.textContent =
          msg.text;


        bubble.appendChild(a);

      }

      else{

        bubble.textContent =
          msg.text;

      }


      row.appendChild(bubble);

      scroll.appendChild(row);

    }

  }


  /* ================= LETTER ================= */

  else if(s.type === 'letter'){

    const head =
      document.createElement('div');


    const kicker =
      document.createElement('div');

    kicker.className =
      'letter-kicker hand';

    kicker.textContent =
      s.kicker;


    const title =
      document.createElement('div');

    title.className =
      'letter-title';

    title.textContent =
      s.title;


    head.appendChild(kicker);

    head.appendChild(title);


    scroll.appendChild(head);


    for(

      let m = 0;

      m < revealedCount &&
      m < s.paragraphs.length;

      m++

    ){

      const p =
        document.createElement('div');

      p.className =
        'letter-p';

      p.textContent =
        s.paragraphs[m];


      scroll.appendChild(p);

    }


    if(

      s.signature &&

      revealedCount >=
      s.paragraphs.length

    ){

      const sig =
        document.createElement('div');

      sig.className =
        'letter-sig letter-p';


      const line1 =
        document.createElement('div');

      line1.className =
        'line1';

      line1.textContent =
        s.signature.line1;


      const name =
        document.createElement('div');

      name.className =
        'name';

      name.textContent =
        s.signature.name;


      sig.appendChild(line1);

      sig.appendChild(name);


      scroll.appendChild(sig);

    }

  }


  requestAnimationFrame(

    () => {

      scroll.scrollTop =
        scroll.scrollHeight;

    }

  );

}


/* ================= DOTS ================= */

function updateDots(){

  Array.from(
    dotsEl.children
  ).forEach(

    (d,idx) => {

      d.classList.toggle(
        'active',
        idx === current
      );

    }

  );

}


/* ================= END ================= */

function isEnd(){

  const s =
    slides[current];


  const total =
    itemCount(s);


  return (

    current ===
    slides.length - 1

    &&

    (
      total === 0

      ||

      revealedCount >= total
    )

  );

}


/* ================= NAV ================= */

function updateNavButtons(){

  prevBtn.disabled =
    current === 0;


  nextBtn.disabled =
    current ===
    slides.length - 1;


  const s =
    slides[current];


  if(isEnd()){

    midBtn.textContent =
      'balik ke awal';

  }

  else if(s.type === 'cover'){

    midBtn.textContent =
      current === 0
        ? 'mulai baca'
        : 'baca ulang dari awal';

  }

  else{

    midBtn.textContent =
      'slide berikutnya';

  }

}


/* ================= AUTO REVEAL ================= */

function autoReveal(){

  const runId =
    ++revealRunId;


  const s =
    slides[current];


  const total =
    itemCount(s);


  if(total === 0){
    return;
  }


  const stepDelay =
    s.type === 'letter'
      ? 1500
      : 850;


  function tick(){

    if(runId !== revealRunId){
      return;
    }


    if(revealedCount < total){

      revealedCount++;


      renderStep(current);

      updateNavButtons();


      setTimeout(
        tick,
        stepDelay
      );

    }

  }


  setTimeout(
    tick,
    550
  );

}


/* ================= SHOW SLIDE ================= */

function showSlide(i,direction){

  const nextIndex =
    Math.max(
      0,
      Math.min(
        slides.length - 1,
        i
      )
    );


  if(
    nextIndex === current &&
    direction
  ){

    return;

  }


  const prevEl =
    slidesEl.children[current];


  const nextEl =
    slidesEl.children[nextIndex];


  if(!nextEl){
    return;
  }


  Array.from(
    slidesEl.children
  ).forEach(

    el => {

      el.classList.remove(
        'current',
        'leaving-fwd',
        'leaving-back'
      );

    }

  );


  nextEl.classList.add(
    'current'
  );


  if(
    direction &&
    prevEl &&
    prevEl !== nextEl
  ){

    animating = true;


    const leavingClass =
      direction === 'fwd'
        ? 'leaving-fwd'
        : 'leaving-back';


    prevEl.classList.add(
      leavingClass
    );


    let cleaned = false;


    const cleanup = () => {

      if(cleaned){
        return;
      }


      cleaned = true;


      prevEl.classList.remove(
        'leaving-fwd',
        'leaving-back'
      );


      animating = false;

    };


    prevEl.addEventListener(
      'animationend',
      cleanup,
      {
        once:true
      }
    );


    setTimeout(
      cleanup,
      700
    );

  }

  else{

    animating = false;

  }


  current =
    nextIndex;


  const s =
    slides[current];


  revealRunId++;


  if(

    s.type === 'chat' ||

    s.type === 'letter'

  ){

    revealedCount = 0;


    renderStep(current);


    const panel =
      document.getElementById(
        'panel-' + current
      );


    if(panel){

      panel.classList.remove(
        'shimmer'
      );


      void panel.offsetWidth;


      panel.classList.add(
        'shimmer'
      );

    }


    autoReveal();

  }

  else{

    revealedCount = 0;

  }


  updateDots();

  updateNavButtons();

}


/* ================= NEXT ================= */

function goNext(){

  if(
    current <
    slides.length - 1
  ){

    showSlide(
      current + 1,
      'fwd'
    );

  }

}


/* ================= PREVIOUS ================= */

function goPrev(){

  if(current > 0){

    showSlide(
      current - 1,
      'back'
    );

  }

}


/* ================= BUTTON EVENTS ================= */

midBtn.addEventListener(
  'click',
  () => {

    if(animating){
      return;
    }


    if(isEnd()){

      showSlide(
        0,
        'back'
      );

      return;

    }


    const s =
      slides[current];


    if(s.type === 'cover'){

      if(current === 0){

        showSlide(
          1,
          'fwd'
        );

      }

      else{

        showSlide(
          0,
          'back'
        );

      }

    }

    else{

      goNext();

    }

  }
);


nextBtn.addEventListener(
  'click',
  () => {

    if(!animating){
      goNext();
    }

  }
);


prevBtn.addEventListener(
  'click',
  () => {

    if(!animating){
      goPrev();
    }

  }
);


/* ================= START ================= */

init();

})();

</script>

</body>
</html>
