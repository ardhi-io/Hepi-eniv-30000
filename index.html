<style>

/* ============================================================
   BASIC
============================================================ */

:root{
  --bg:#1C0F13;
  --bg-deep:#140A0D;
  --card:#2A1519;
  --ink:#F1E4E1;
  --ink-soft:#C9A9AC;
  --wine:#6E2233;
  --wine-soft:#4A1C28;
  --rose:#B85C6E;
  --gold:#C8A465;
  --line:rgba(241,228,225,0.1);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
}

body{
  background:var(--bg-deep);
  color:var(--ink);
  font-family:'Quicksand',sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

button{
  font-family:inherit;
  border:none;
  outline:none;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.hand{
  font-family:'Caveat',cursive;
}


/* ============================================================
   APP
============================================================ */

#app{
  position:relative;

  width:100%;
  max-width:480px;

  height:100vh;
  height:100dvh;

  margin:0 auto;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  background:
    radial-gradient(
      ellipse at 20% 0%,
      rgba(110,34,51,.35),
      transparent 55%
    ),
    radial-gradient(
      ellipse at 90% 100%,
      rgba(200,164,101,.10),
      transparent 50%
    ),
    var(--bg);
}


/* ============================================================
   DOTS
============================================================ */

.dots{
  position:relative;
  z-index:20;

  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:6px;

  padding:10px 12px 7px;

  flex-shrink:0;
}

.dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:rgba(241,228,225,.12);

  transition:
    background .25s ease,
    transform .25s ease;
}

.dot.active{
  background:var(--gold);
  transform:scale(1.45);
}


/* ============================================================
   SLIDE AREA
============================================================ */

#slides{
  position:relative;

  flex:1;
  min-height:0;

  width:100%;

  overflow:hidden;
}


/* ============================================================
   SLIDES
============================================================ */

.slide{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;

  min-height:0;

  padding:6px 18px 12px;

  opacity:0;

  pointer-events:none;

  transform:translateX(24px);

  transition:
    opacity .42s ease,
    transform .42s cubic-bezier(.22,.61,.36,1);

  z-index:1;
}

.slide.current{
  opacity:1;

  pointer-events:auto;

  transform:translateX(0);

  z-index:2;
}

.slide.leaving-fwd{
  opacity:0;

  transform:translateX(-24px);

  pointer-events:none;

  z-index:1;
}

.slide.leaving-back{
  opacity:0;

  transform:translateX(24px);

  pointer-events:none;

  z-index:1;
}


/* ============================================================
   PHOTO
============================================================ */

.photo-frame{
  position:relative;

  width:100%;

  aspect-ratio:4 / 3;

  flex-shrink:0;

  overflow:hidden;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      var(--wine-soft),
      var(--card)
    );

  border:1px solid rgba(200,164,101,.25);

  box-shadow:
    0 12px 26px rgba(0,0,0,.45);

  isolation:isolate;
}

.photo-frame img{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  opacity:1;

  transition:opacity .25s ease;
}

.photo-frame.no-photo img{
  display:none;
}

.photo-frame.no-photo::after{
  content:"taruh fotonya di sini 🩷";

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:0 30px;

  font-family:'Caveat',cursive;

  font-size:1.3rem;

  color:var(--ink-soft);
}


/* ============================================================
   TWINKLE
============================================================ */

.twinkle{
  position:absolute;

  z-index:3;

  color:#FFE9BE;

  font-size:.7rem;

  pointer-events:none;

  opacity:0;

  animation:
    twinkle 2.8s ease-in-out infinite;
}

@keyframes twinkle{

  0%,
  100%{
    opacity:0;
    transform:scale(.5) rotate(0);
  }

  50%{
    opacity:1;
    transform:scale(1.12) rotate(20deg);
  }

}


/* ============================================================
   COVER
============================================================ */

.cover{
  flex:1;

  min-height:0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  gap:15px;

  overflow-y:auto;

  padding:4px 0 8px;
}

.cover .photo-frame{
  width:74%;

  aspect-ratio:1 / 1;

  flex-shrink:0;
}

.cover .kicker{
  font-family:'Caveat',cursive;

  font-size:1.15rem;

  color:var(--gold);
}

.cover h1{
  margin:0;

  font-family:'Caveat',cursive;

  font-weight:700;

  font-size:2.5rem;

  line-height:1.1;

  color:var(--ink);
}

.cover p{
  max-width:340px;

  margin:0;

  font-size:.98rem;

  line-height:1.65;

  color:var(--ink-soft);
}


/* ============================================================
   PANELS
============================================================ */

.chat-panel,
.letter-panel{
  flex:1;

  min-height:0;

  margin-top:14px;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  position:relative;

  background:var(--card);

  border:1px solid var(--line);

  border-radius:18px;

  box-shadow:
    0 10px 24px rgba(0,0,0,.4);
}


/* ============================================================
   SHIMMER
============================================================ */

.chat-panel.shimmer::before,
.letter-panel.shimmer::before{
  content:"";

  position:absolute;

  top:0;
  bottom:0;

  left:-100%;

  width:60%;

  z-index:5;

  pointer-events:none;

  background:
    linear-gradient(
      100deg,
      transparent,
      rgba(200,164,101,.20),
      transparent
    );

  animation:
    shimmer-sweep 1s ease forwards;
}

@keyframes shimmer-sweep{

  to{
    left:140%;
  }

}


/* ============================================================
   CHAT SCROLL
============================================================ */

.chat-scroll,
.letter-scroll{
  flex:1;

  min-height:0;

  overflow-y:auto;

  overscroll-behavior:contain;

  -webkit-overflow-scrolling:touch;

  scrollbar-width:none;
}

.chat-scroll::-webkit-scrollbar,
.letter-scroll::-webkit-scrollbar{
  display:none;
}


/* ============================================================
   CHAT
============================================================ */

.chat-scroll{
  display:flex;

  flex-direction:column;

  gap:6px;

  padding:16px 16px 8px;
}

.msg-row{
  display:flex;

  flex-direction:column;

  max-width:82%;

  opacity:0;

  transform:
    translateY(8px)
    scale(.98);

  animation:
    message-in .35s
    cubic-bezier(.22,.61,.36,1)
    forwards;
}

@keyframes message-in{

  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }

}

.msg-row.from-a{
  align-self:flex-start;
}

.msg-row.from-k{
  align-self:flex-end;
}

.sender-label{
  margin:6px 2px 2px;

  font-size:.66rem;

  font-weight:600;

  color:var(--ink-soft);
}

.msg-row.from-k .sender-label{
  text-align:right;
}

.bubble{
  padding:9px 14px;

  border-radius:16px;

  font-size:.92rem;

  line-height:1.4;

  word-break:break-word;
}

.from-a .bubble{
  background:var(--wine-soft);

  color:var(--ink);

  border-bottom-left-radius:5px;
}

.from-k .bubble{
  background:var(--wine);

  color:#FBEEF0;

  border-bottom-right-radius:5px;
}

.bubble.link a{
  color:inherit;

  text-decoration:underline;

  word-break:break-all;
}


/* ============================================================
   LETTER
============================================================ */

.letter-scroll{
  display:flex;

  flex-direction:column;

  gap:14px;

  padding:20px 20px 12px;
}

.letter-kicker{
  font-family:'Caveat',cursive;

  font-size:1.1rem;

  color:var(--gold);

  margin-bottom:-4px;
}

.letter-title{
  font-family:'Caveat',cursive;

  font-size:1.7rem;

  color:var(--ink);

  margin-bottom:2px;
}

.letter-p{
  font-family:'Cormorant Garamond',serif;

  font-style:italic;

  font-size:1.18rem;

  line-height:1.65;

  color:var(--ink);

  opacity:0;

  transform:translateY(8px);

  animation:
    paragraph-in .5s ease forwards;
}

@keyframes paragraph-in{

  to{
    opacity:1;

    transform:translateY(0);
  }

}

.letter-sig{
  margin-top:6px;

  text-align:right;
}

.letter-sig .line1{
  font-family:'Cormorant Garamond',serif;

  font-style:italic;

  font-size:1.05rem;

  color:var(--ink-soft);
}

.letter-sig .name{
  display:inline-block;

  margin-top:2px;

  font-family:'Caveat',cursive;

  font-size:2.1rem;

  color:var(--gold);

  animation:
    heartbeat 1.8s ease-in-out infinite;
}

@keyframes heartbeat{

  0%,
  100%{
    transform:scale(1);
  }

  15%{
    transform:scale(1.08);
  }

  30%{
    transform:scale(1);
  }

  45%{
    transform:scale(1.05);
  }

}


/* ============================================================
   NAVIGATION
============================================================ */

.nav{
  position:relative;

  z-index:20;

  width:100%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  padding:10px 18px 18px;

  flex-shrink:0;
}

.nav-btn{
  width:44px;
  height:44px;

  flex-shrink:0;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:var(--card);

  border:1px solid var(--line);

  color:var(--ink);

  font-size:1.1rem;

  box-shadow:
    0 4px 10px rgba(0,0,0,.4);

  transition:
    transform .18s ease,
    opacity .18s ease;
}

.nav-btn:active{
  transform:scale(.94);
}

.nav-btn:disabled{
  opacity:.3;

  cursor:default;
}

.nav-btn.big{
  flex:1;

  width:auto;

  border-radius:24px;

  padding:12px;

  color:#fff;

  font-size:1rem;

  font-weight:600;

  letter-spacing:.2px;

  background:
    linear-gradient(
      120deg,
      var(--wine),
      var(--rose)
    );

  box-shadow:
    0 4px 14px rgba(184,92,110,.25);

  transition:
    transform .18s ease,
    box-shadow .25s ease;
}

.nav-btn.big:active{
  transform:scale(.98);
}


/* ============================================================
   SMALL SCREEN
============================================================ */

@media(max-height:650px){

  .dots{
    height:28px;

    padding-top:6px;
    padding-bottom:4px;
  }

  .cover{
    gap:9px;
  }

  .cover .photo-frame{
    width:55%;
  }

  .cover h1{
    font-size:2.2rem;
  }

  .cover p{
    font-size:.88rem;

    line-height:1.5;
  }

  .nav{
    padding-top:7px;
    padding-bottom:9px;
  }

  .photo-frame{
    border-radius:15px;
  }

  .chat-panel,
  .letter-panel{
    border-radius:15px;
  }

}


/* ============================================================
   REDUCED MOTION
============================================================ */

@media(prefers-reduced-motion:reduce){

  .slide{
    transition:none;
  }

  .msg-row,
  .letter-p{
    animation:none;

    opacity:1;

    transform:none;
  }

  .twinkle,
  .letter-sig .name,
  .chat-panel.shimmer::before,
  .letter-panel.shimmer::before{
    animation:none;
  }

}

</style>

  img.alt = alt || '';

  img.loading = 'eager';

  img.decoding = 'async';

  img.addEventListener(
    'error',
    function(){

      img.style.display = 'none';

      const frame =
        img.closest('.photo-frame');

      if(frame){

        frame.classList.add(
          'no-photo'
        );

      }

    }
  );

  return img;

}


/* ============================================================
   TWINKLES
============================================================ */

function addTwinkles(frame){

  TWINKLE_POS.forEach(
    position => {

      const span =
        document.createElement('span');

      span.className =
        'twinkle';

      span.textContent =
        '✦';

      span.style.top =
        position.top;

      span.style.left =
        position.left;

      span.style.animationDelay =
        position.delay;

      frame.appendChild(span);

    }
  );

}


/* ============================================================
   PHOTO FRAME
============================================================ */

function createPhotoFrame(
  photo,
  alt,
  square = false
){

  const frame =
    document.createElement('div');

  frame.className =
    'photo-frame';


  if(square){

    frame.style.aspectRatio =
      '1 / 1';

  }


  const img =
    createImage(
      photo,
      alt
    );


  if(img){

    frame.appendChild(img);

  }


  addTwinkles(frame);


  return frame;

}


/* ============================================================
   BUILD SLIDE
============================================================ */

function buildSlide(
  slide,
  index
){

  const el =
    document.createElement('div');

  el.className =
    'slide';

  el.dataset.index =
    index;


  /* ----------------------------------------------------------
     COVER
  ---------------------------------------------------------- */

  if(slide.type === 'cover'){

    const cover =
      document.createElement('div');

    cover.className =
      'cover';


    const frame =
      createPhotoFrame(
        slide.photo,
        slide.title,
        true
      );

    frame.style.width =
      '74%';


    const kicker =
      document.createElement('div');

    kicker.className =
      'kicker hand';

    kicker.textContent =
      slide.kicker;


    const title =
      document.createElement('h1');

    title.textContent =
      slide.title;


    const text =
      document.createElement('p');

    text.textContent =
      slide.text;


    cover.appendChild(frame);

    cover.appendChild(kicker);

    cover.appendChild(title);

    cover.appendChild(text);


    el.appendChild(cover);

  }


  /* ----------------------------------------------------------
     CHAT
  ---------------------------------------------------------- */

  else if(slide.type === 'chat'){

    const frame =
      createPhotoFrame(
        slide.photo,
        'Momen chat'
      );


    const panel =
      document.createElement('div');

    panel.className =
      'chat-panel';

    panel.id =
      'panel-' + index;


    const scroll =
      document.createElement('div');

    scroll.className =
      'chat-scroll';

    scroll.id =
      'scroll-' + index;


    panel.appendChild(scroll);

    el.appendChild(frame);

    el.appendChild(panel);

  }


  /* ----------------------------------------------------------
     LETTER
  ---------------------------------------------------------- */

  else if(slide.type === 'letter'){

    if(slide.photo){

      const frame =
        createPhotoFrame(
          slide.photo,
          slide.title
        );

      frame.style.aspectRatio =
        '16 / 9';

      el.appendChild(frame);

    }


    const panel =
      document.createElement('div');

    panel.className =
      'letter-panel';

    panel.id =
      'panel-' + index;


    panel.style.marginTop =
      slide.photo
        ? '14px'
        : '6px';


    const scroll =
      document.createElement('div');

    scroll.className =
      'letter-scroll';

    scroll.id =
      'scroll-' + index;


    panel.appendChild(scroll);

    el.appendChild(panel);

  }


  return el;

}


/* ============================================================
   RENDER ALL SLIDES
============================================================ */

function createSlides(){

  slidesEl.innerHTML = '';

  dotsEl.innerHTML = '';


  slides.forEach(
    (slide,index) => {

      const element =
        buildSlide(
          slide,
          index
        );

      slidesEl.appendChild(
        element
      );


      const dot =
        document.createElement('div');

      dot.className =
        'dot';


      dotsEl.appendChild(
        dot
      );

    }
  );

}


/* ============================================================
   RENDER CURRENT CONTENT
============================================================ */

function renderStep(index){

  const slide =
    slides[index];


  const scroll =
    document.getElementById(
      'scroll-' + index
    );


  if(!scroll){
    return;
  }


  scroll.innerHTML = '';


  /* ==========================================================
     CHAT
  ========================================================== */

  if(slide.type === 'chat'){

    let lastWho = null;


    for(

      let i = 0;

      i < revealedCount &&
      i < slide.messages.length;

      i++

    ){

      const message =
        slide.messages[i];


      const row =
        document.createElement('div');

      row.className =
        'msg-row from-' +
        message.who;


      if(message.who !== lastWho){

        const label =
          document.createElement('div');

        label.className =
          'sender-label';

        label.textContent =
          message.who === 'a'
            ? 'Ardhian'
            : 'Kailash';


        row.appendChild(label);


        lastWho =
          message.who;

      }


      const bubble =
        document.createElement('div');

      bubble.className =
        'bubble';


      if(message.link){

        bubble.classList.add(
          'link'
        );


        const link =
          document.createElement('a');

        link.href =
          'https://' +
          message.text;

        link.target =
          '_blank';

        link.rel =
          'noopener noreferrer';

        link.textContent =
          message.text;


        bubble.appendChild(
          link
        );

      }

      else{

        bubble.textContent =
          message.text;

      }


      row.appendChild(
        bubble
      );


      scroll.appendChild(
        row
      );

    }

  }


  /* ==========================================================
     LETTER
  ========================================================== */

  else if(slide.type === 'letter'){

    const head =
      document.createElement('div');


    const kicker =
      document.createElement('div');

    kicker.className =
      'letter-kicker hand';

    kicker.textContent =
      slide.kicker;


    const title =
      document.createElement('div');

    title.className =
      'letter-title';

    title.textContent =
      slide.title;


    head.appendChild(
      kicker
    );

    head.appendChild(
      title
    );


    scroll.appendChild(
      head
    );


    for(

      let i = 0;

      i < revealedCount &&
      i < slide.paragraphs.length;

      i++

    ){

      const paragraph =
        document.createElement('div');

      paragraph.className =
        'letter-p';

      paragraph.textContent =
        slide.paragraphs[i];


      scroll.appendChild(
        paragraph
      );

    }


    /* --------------------------------------------------------
       SIGNATURE
    -------------------------------------------------------- */

    if(

      slide.signature &&

      revealedCount >=
      slide.paragraphs.length

    ){

      const signature =
        document.createElement('div');

      signature.className =
        'letter-sig letter-p';


      const line =
        document.createElement('div');

      line.className =
        'line1';

      line.textContent =
        slide.signature.line1;


      const name =
        document.createElement('div');

      name.className =
        'name';

      name.textContent =
        slide.signature.name;


      signature.appendChild(
        line
      );

      signature.appendChild(
        name
      );


      scroll.appendChild(
        signature
      );

    }

  }


  /* ==========================================================
     ALWAYS SCROLL TO BOTTOM
  ========================================================== */

  requestAnimationFrame(
    () => {

      scroll.scrollTop =
        scroll.scrollHeight;

    }
  );

}


/* ============================================================
   DOT UPDATE
============================================================ */

function updateDots(){

  Array.from(
    dotsEl.children
  ).forEach(
    (dot,index) => {

      dot.classList.toggle(
        'active',
        index === current
      );

    }
  );

}


/* ============================================================
   CHECK END
============================================================ */

function isEnd(){

  const slide =
    slides[current];


  const total =
    itemCount(slide);


  return (

    current ===
    slides.length - 1

    &&

    (
      total === 0

      ||

      revealedCount >=
      total
    )

  );

}


/* ============================================================
   NAV BUTTON TEXT
============================================================ */

function updateNavButtons(){

  prevBtn.disabled =
    current === 0;


  nextBtn.disabled =
    current ===
    slides.length - 1;


  const slide =
    slides[current];


  if(isEnd()){

    midBtn.textContent =
      'balik ke awal';

  }

  else if(slide.type === 'cover'){

    midBtn.textContent =
      'mulai baca';

  }

  else{

    midBtn.textContent =
      'slide berikutnya';

  }

}


/* ============================================================
   AUTO REVEAL
============================================================ */

function autoReveal(){

  const run =
    ++revealRunId;


  const slide =
    slides[current];


  const total =
    itemCount(slide);


  if(total === 0){
    return;
  }


  const delay =
    slide.type === 'letter'
      ? 1500
      : 850;


  function reveal(){

    if(run !== revealRunId){
      return;
    }


    if(revealedCount < total){

      revealedCount++;


      renderStep(
        current
      );


      updateNavButtons();


      setTimeout(
        reveal,
        delay
      );

    }

  }


  setTimeout(
    reveal,
    550
  );

}


/* ============================================================
   SHOW SLIDE
============================================================ */

function showSlide(
  target,
  direction
){

  const nextIndex =
    Math.max(
      0,
      Math.min(
        slides.length - 1,
        target
      )
    );


  if(
    nextIndex === current &&
    direction
  ){

    return;

  }


  const previous =
    slidesEl.children[current];


  const next =
    slidesEl.children[nextIndex];


  if(!next){
    return;
  }


  /*
     STOP OLD REVEAL TIMER
  */

  revealRunId++;


  /*
     REMOVE OLD CLASSES
  */

  Array.from(
    slidesEl.children
  ).forEach(
    slide => {

      slide.classList.remove(
        'current',
        'leaving-fwd',
        'leaving-back'
      );

    }
  );


  /*
     CURRENT INDEX
  */

  current =
    nextIndex;


  /*
     SET PREVIOUS ANIMATION
  */

  if(
    previous &&
    previous !== next &&
    direction
  ){

    previous.classList.add(
      direction === 'fwd'
        ? 'leaving-fwd'
        : 'leaving-back'
    );

  }


  /*
     SHOW NEXT
  */

  next.classList.add(
    'current'
  );


  /*
     RESET CONTENT
  */

  const slide =
    slides[current];


  revealedCount = 0;


  if(

    slide.type === 'chat' ||

    slide.type === 'letter'

  ){

    renderStep(
      current
    );


    const panel =
      document.getElementById(
        'panel-' + current
      );


    if(panel){

      panel.classList.remove(
        'shimmer'
      );


      void panel.offsetWidth;


      panel.classList.add(
        'shimmer'
      );

    }


    autoReveal();

  }


  updateDots();

  updateNavButtons();


  /*
     ANIMATION LOCK
  */

  animating = true;


  setTimeout(
    () => {

      animating = false;

    },
    460
  );

}


/* ============================================================
   NEXT
============================================================ */

function goNext(){

  if(
    animating
  ){

    return;

  }


  if(
    current <
    slides.length - 1
  ){

    showSlide(
      current + 1,
      'fwd'
    );

  }

}


/* ============================================================
   PREVIOUS
============================================================ */

function goPrev(){

  if(
    animating
  ){

    return;

  }


  if(
    current > 0
  ){

    showSlide(
      current - 1,
      'back'
    );

  }

}


/* ============================================================
   MIDDLE BUTTON
============================================================ */

midBtn.addEventListener(
  'click',
  () => {

    if(animating){
      return;
    }


    /*
       LAST SLIDE
    */

    if(isEnd()){

      showSlide(
        0,
        'back'
      );

      return;

    }


    const slide =
      slides[current];


    /*
       COVER
    */

    if(slide.type === 'cover'){

      goNext();

      return;

    }


    /*
       NORMAL SLIDE
    */

    goNext();

  }
);


/* ============================================================
   NEXT BUTTON
============================================================ */

nextBtn.addEventListener(
  'click',
  () => {

    goNext();

  }
);


/* ============================================================
   PREVIOUS BUTTON
============================================================ */

prevBtn.addEventListener(
  'click',
  () => {

    goPrev();

  }
);


/* ============================================================
   INITIALIZE
============================================================ */

function init(){

  createSlides();


  /*
     Jangan pakai showSlide()
     untuk initial load karena
     belum ada slide sebelumnya.
  */

  current = 0;

  revealedCount = 0;

  animating = false;


  Array.from(
    slidesEl.children
  ).forEach(
    (slide,index) => {

      slide.classList.toggle(
        'current',
        index === 0
      );

    }
  );


  updateDots();

  updateNavButtons();


  /*
     COVER TIDAK PERLU AUTO REVEAL
  */

}


/* ============================================================
   START
============================================================ */

init();


})();

</script>
